batch.delete.template.system.log.cleanup.suggestion=使用建议：\n1. 建议在系统低峰期执行\n2. 可以根据日志量调整每次删除的行数\n3. 保留ERROR和WARN级别的日志\n4. 执行前建议备份重要日志
batch.delete.template.user.operation.log.cleanup.suggestion=使用建议：\n1. 建议保留登录、登出等重要操作记录\n2. 可以根据用户量调整删除频率\n3. 考虑按用户ID分批次删除\n4. 执行前确认业务需求
batch.delete.template.business.data.cleanup.suggestion=使用建议：\n1. 只删除已完成状态的业务数据\n2. 建议分批执行，避免影响业务\n3. 执行前必须备份数据\n4. 考虑数据归档而非直接删除
batch.delete.template.temp.data.cleanup.suggestion=使用建议：\n1. 可以设置定时任务自动执行\n2. 删除频率可以较高\n3. 确认数据确实不需要保留\n4. 监控删除对性能的影响
batch.delete.template.audit.log.cleanup.suggestion=使用建议：\n1. 保留重要的审计记录\n2. 遵守合规要求\n3. 建议先归档再删除\n4. 记录删除操作本身
batch.delete.template.custom.suggestion=使用建议：\n1. 根据具体业务场景调整参数\n2. 测试环境先验证\n3. 小批量测试后再大批量执行\n4. 监控执行过程和结果
